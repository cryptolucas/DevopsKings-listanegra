###############################################################################
# AWS CodeBuild - Integracion continua del microservicio de lista negra.
#
# 1. Instala las dependencias (las de la app + pytest).
# 2. Ejecuta las pruebas unitarias con SQLite en memoria (sin motor externo).
# 3. Si pasan, genera el artefacto desplegable: el mismo bundle que se sube a
#    Elastic Beanstalk. Solo se genera; esta entrega NO incluye despliegue (CD).
#
# Imagen recomendada: aws/codebuild/amazonlinux-x86_64-standard:5.0
# (Amazon Linux 2023, igual que la plataforma de Beanstalk).
###############################################################################
version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - python --version
      - pip install --upgrade pip
      - pip install -r requirements-dev.txt

  build:
    # Si una prueba falla, el build queda FAILED y el pipeline se detiene.
    commands:
      - echo "Ejecutando pruebas unitarias"
      - python -m pytest -v --junitxml=reports/junit.xml

  post_build:
    commands:
      - |
        if [ "$CODEBUILD_BUILD_SUCCEEDING" = "1" ]; then
          echo "Pruebas superadas. Empaquetando version $(grep -o '[0-9][0-9.]*' src/version.py) (commit ${CODEBUILD_RESOLVED_SOURCE_VERSION})"
        else
          echo "Pruebas fallidas: el artefacto no es apto para desplegar."
        fi

reports:
  pruebas-unitarias:
    files:
      - junit.xml
    base-directory: reports
    file-format: JUNITXML

artifacts:
  files:
    - application.py
    - Procfile
    - requirements.txt
    - .ebextensions/**/*
    - src/**/*
  exclude-paths:
    - "**/__pycache__/**"
